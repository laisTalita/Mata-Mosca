<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mata Mosquito</title>
    <link rel="stylesheet" href="estilo/style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body id="b-index">
     
    <div id="controleMusica">
        <button id="botaoMusica">
            <i id="ligaMusica" class='bx bx-volume-full'></i>
            <i id="desligaMusica" class='bx bx-volume-mute oculto'></i>
        </button>
        <input type="range" id="regulaMusica" class="oculto" value="1" min="0" max="5" step="1">
    </div>
    <audio id="bgm" src="imagens/amusement_park_stage_bpm150.ogg" loop autoplay></audio>
          
    <img src="imagens/game.png" alt="">
    <div class="botoesGame">
        <button class="verde" onclick="window.location.href='papaMosca.html?nivel=facil'">Nível fácil</button>
        <button class="azul" onclick="window.location.href='papaMosca.html?nivel=medio'">Nível médio</button>
        <button class="vermelho" onclick="window.location.href='papaMosca.html?nivel=dificil'">Nível difícil</button>
    </div>
    <script src="javaS/musica.js"></script>


</body>
</html>
